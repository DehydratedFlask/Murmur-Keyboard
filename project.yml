name: Murmur
options:
  bundleIdPrefix: com.murmur
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "8957296QYR"
    CODE_SIGN_STYLE: Automatic

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.17.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.17.7"

targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - Sources/Murmur
      - Sources/Shared
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - target: MurmurKeyboard
        embed: true
      - target: MurmurWidget
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Sources/Murmur/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Murmur/Murmur.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.dictation
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Murmur/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "3.1"
        CFBundleVersion: "11"
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.murmur.dictation
            CFBundleURLSchemes:
              - murmur
        NSMicrophoneUsageDescription: "Murmur needs microphone access to transcribe your speech on-device."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  MurmurKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Sources/MurmurKeyboard
      - Sources/Shared
    settings:
      base:
        INFOPLIST_FILE: Sources/MurmurKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MurmurKeyboard/MurmurKeyboard.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.dictation.keyboard
    info:
      path: Sources/MurmurKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: "3.1"
        CFBundleVersion: "11"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController

  MurmurWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/MurmurWidget
    settings:
      base:
        INFOPLIST_FILE: Sources/MurmurWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.dictation.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Sources/MurmurWidget/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: "3.1"
        CFBundleVersion: "11"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Murmur:
    build:
      targets:
        Murmur: all
        MurmurKeyboard: all
        MurmurWidget: all
    run:
      config: Debug
