name: Release

# Publishes an unsigned device IPA as a GitHub release.
#
# Run it from the Actions tab (Run workflow) with a tag such as v3.1, or push a
# tag that starts with "v". The release is created from RELEASE_NOTES_V3.1.md
# and the IPA is attached to it.
#
# The build is unsigned on purpose: it is the arm64 device build used for
# downstream signing and verification, exactly like the 3.0 release. Signing
# needs an Apple Developer profile carrying Murmur's App Group entitlement,
# which CI does not have.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.1"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          echo "Packaging $APP"
          rm -rf Payload Murmur.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Murmur.ipa Payload
          ls -lh Murmur.ipa

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES_V3.1.md
          files: Murmur.ipa
          fail_on_unmatched_files: true
          draft: false
